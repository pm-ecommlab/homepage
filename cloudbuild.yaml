# Cloud Build: ecommlab homepage (Next.js) → Artifact Registry → Cloud Run.
#
# Substitutions (defaults overridden by GitHub Actions):
#   COMMIT_SHA, _REGION, _REPO, _SERVICE
#   _NEXT_PUBLIC_SITE_URL, _NEXT_PUBLIC_COOKIEBOT_ID,
#   _NEXT_PUBLIC_GTM_ID, _NEXT_PUBLIC_TURNSTILE_SITE_KEY

substitutions:
  _REGION: europe-central2
  _REPO: ecommlab-docker
  _SERVICE: ecommlab-web
  _NEXT_PUBLIC_SITE_URL: https://ecommlab.io
  _NEXT_PUBLIC_COOKIEBOT_ID: ""
  _NEXT_PUBLIC_GTM_ID: ""
  _NEXT_PUBLIC_TURNSTILE_SITE_KEY: ""

steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "--build-arg"
      - "NEXT_PUBLIC_SITE_URL=${_NEXT_PUBLIC_SITE_URL}"
      - "--build-arg"
      - "NEXT_PUBLIC_COOKIEBOT_ID=${_NEXT_PUBLIC_COOKIEBOT_ID}"
      - "--build-arg"
      - "NEXT_PUBLIC_GTM_ID=${_NEXT_PUBLIC_GTM_ID}"
      - "--build-arg"
      - "NEXT_PUBLIC_TURNSTILE_SITE_KEY=${_NEXT_PUBLIC_TURNSTILE_SITE_KEY}"
      - "-t"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:$COMMIT_SHA"
      - "-t"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:latest"
      - "-f"
      - "Dockerfile"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "--all-tags", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web"]

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "${_SERVICE}"
      - "--image"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:$COMMIT_SHA"
      - "--region"
      - "${_REGION}"
      - "--platform"
      - "managed"
      - "--allow-unauthenticated"
      - "--memory"
      - "512Mi"
      - "--cpu"
      - "1"
      - "--min-instances"
      - "0"
      - "--max-instances"
      - "5"
      - "--port"
      - "8080"
      - "--set-secrets"
      - "SMTP_HOST=SMTP_HOST:latest,SMTP_PORT=SMTP_PORT:latest,SMTP_USER=SMTP_USER:latest,SMTP_PASS=SMTP_PASS:latest,SMTP_FROM=SMTP_FROM:latest,CONTACT_TO=CONTACT_TO:latest,TURNSTILE_SECRET_KEY=TURNSTILE_SECRET_KEY:latest"
      - "--update-env-vars"
      - "NODE_ENV=production,SITE_URL=${_NEXT_PUBLIC_SITE_URL}"

images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:$COMMIT_SHA"
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:latest"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
