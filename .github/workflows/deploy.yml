# Deploy — zweigleisig: pm2-Server (ecommlab-new) ODER Google Cloud Run.
#
# Ziel-Wahl:
#   · Push auf main         → DEFAULT_TARGET (unten), aktuell "ecommlab-new"
#   · Actions-Tab → Run     → Ziel manuell wählbar (ecommlab-new | gcloud)
#
# GCP ist provisioniert, Live-Traffic bleibt auf ecommlab-new bis zum DNS-Cutover.
# Siehe docs/deployment-gcp.md.
#
# Benötigte Repository-Secrets für das Ziel "ecommlab-new"
# (identisch zu mydev.ai / pm-ecommlab):
#   ECOMMLAB_SSH_KEY      privater Deploy-Schlüssel (ed25519, ohne Passphrase)
#   ECOMMLAB_KNOWN_HOSTS  Host-Key des Servers (verhindert MITM):
#                         49.12.194.37 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIyKLVpuH21pZU+Suj2X8ySIiQig9Cw4kL5T7TWeEDzj

name: Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy-Ziel"
        type: choice
        options: [ecommlab-new, gcloud]
        default: ecommlab-new
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".gitignore"

permissions:
  contents: read
  id-token: write # OIDC für Workload Identity Federation (nur gcloud-Ziel)

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  # Standard-Ziel für automatische Deploys. Auf "gcloud" umstellen, wenn
  # Live-Traffic bewusst auf Cloud Run gehen soll.
  DEFAULT_TARGET: ecommlab-new

jobs:
  target:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.pick.outputs.name }}
      ready: ${{ steps.pick.outputs.ready }}
    steps:
      - id: pick
        run: |
          TARGET="${{ inputs.target || env.DEFAULT_TARGET }}"
          READY=true
          if [ "$TARGET" = "ecommlab-new" ] && [ -z "${{ secrets.ECOMMLAB_SSH_KEY }}" ]; then
            READY=false
            echo "::warning::Secret ECOMMLAB_SSH_KEY fehlt — Deploy wird übersprungen (Einrichtung: deploy/README.md)"
          fi
          {
            echo "name=${TARGET}"
            echo "ready=${READY}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### 🎯 Deploy-Ziel: \`${TARGET}\`"
            [ "$READY" = "false" ] && echo "> ⏭️ **Übersprungen** — Secret \`ECOMMLAB_SSH_KEY\` fehlt. Einrichtung: [deploy/README.md](../blob/main/deploy/README.md)"
          } >> "$GITHUB_STEP_SUMMARY" || true

  deploy-ecommlab:
    needs: [target]
    if: needs.target.outputs.name == 'ecommlab-new' && needs.target.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SSH einrichten
        run: |
          if [ -z "${{ secrets.ECOMMLAB_SSH_KEY }}" ]; then
            echo "::error::Secret ECOMMLAB_SSH_KEY fehlt — siehe deploy/README.md"
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.ECOMMLAB_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Host-Key aus dem Secret: keine blinde Annahme (kein StrictHostKeyChecking=no).
          printf '%s\n' "${{ secrets.ECOMMLAB_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy auf ecommlab-new
        env:
          SKIP_VERIFY: "1"
        run: |
          chmod +x ./scripts/deploy.sh
          ./scripts/deploy.sh root@49.12.194.37

      - name: Zusammenfassung
        run: |
          {
            echo "### ✅ Deploy auf ecommlab-new"
            echo "- App: \`ecommlab-prod\` (pm2), Port 3000"
            echo "- Path: \`/var/www/ecommlab-relaunch\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-gcloud:
    needs: [target]
    if: needs.target.outputs.name == 'gcloud'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Umgebung auflösen
        id: env
        run: |
          ENV=prod
          set -a; source "deploy/environments/${ENV}.env"; set +a
          if [ "${PROJECT_NUMBER}" = "CHANGEME_RUN_PROVISION" ] || [ -z "${PROJECT_NUMBER}" ]; then
            echo "::error::${ENV}.env hat keine PROJECT_NUMBER — scripts/gcp-provision.sh ${ENV} --write-config"
            exit 1
          fi
          {
            echo "env_name=${ENV}"
            echo "project_id=${PROJECT_ID}"
            echo "region=${REGION}"
            echo "repo=${REPO}"
            echo "web_service=${WEB_SERVICE}"
            echo "site_url=${NEXT_PUBLIC_SITE_URL}"
            echo "cookiebot_id=${NEXT_PUBLIC_COOKIEBOT_ID}"
            echo "gtm_id=${NEXT_PUBLIC_GTM_ID}"
            echo "turnstile_site_key=${NEXT_PUBLIC_TURNSTILE_SITE_KEY}"
            echo "wif_provider=projects/${PROJECT_NUMBER}/locations/global/workloadIdentityPools/${WIF_POOL}/providers/${WIF_PROVIDER}"
            echo "deployer_sa=${DEPLOYER_SA}@${PROJECT_ID}.iam.gserviceaccount.com"
          } >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ steps.env.outputs.wif_provider }}
          service_account: ${{ steps.env.outputs.deployer_sa }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ steps.env.outputs.project_id }}

      - name: Build & Deploy über Cloud Build
        run: |
          gcloud builds submit \
            --project "${{ steps.env.outputs.project_id }}" \
            --config cloudbuild.yaml \
            --substitutions=COMMIT_SHA=${GITHUB_SHA::12},_REGION=${{ steps.env.outputs.region }},_REPO=${{ steps.env.outputs.repo }},_SERVICE=${{ steps.env.outputs.web_service }},_NEXT_PUBLIC_SITE_URL=${{ steps.env.outputs.site_url }},_NEXT_PUBLIC_COOKIEBOT_ID=${{ steps.env.outputs.cookiebot_id }},_NEXT_PUBLIC_GTM_ID=${{ steps.env.outputs.gtm_id }},_NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ steps.env.outputs.turnstile_site_key }} \
            .

      - name: Zusammenfassung
        run: |
          URL=$(gcloud run services describe "${{ steps.env.outputs.web_service }}" \
            --project "${{ steps.env.outputs.project_id }}" \
            --region "${{ steps.env.outputs.region }}" --format 'value(status.url)')
          {
            echo "### ✅ Deploy auf Google Cloud Run"
            echo "- Service: \`${{ steps.env.outputs.web_service }}\`"
            echo "- URL: ${URL}"
            echo "- Hinweis: DNS zeigt noch auf ecommlab-new, bis ihr bewusst umstellt."
          } >> "$GITHUB_STEP_SUMMARY"
