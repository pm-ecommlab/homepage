name: Deploy

# Manual only — pick the target in the Actions UI.
# Live traffic stays on ecommlab-new until you deliberately cut over DNS to GCP.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Deploy-Ziel
        required: true
        type: choice
        default: ecommlab-new
        options:
          - ecommlab-new
          - gcloud

permissions:
  contents: read
  id-token: write # OIDC for GCP (WIF); unused for ecommlab-new

concurrency:
  group: deploy-${{ inputs.target }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy-ecommlab-new:
    if: inputs.target == 'ecommlab-new'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require SSH secrets
        env:
          HOST: ${{ secrets.ECOMMLAB_NEW_HOST }}
          USER: ${{ secrets.ECOMMLAB_NEW_USER }}
          KEY: ${{ secrets.ECOMMLAB_NEW_SSH_KEY }}
        run: |
          missing=0
          [ -n "$HOST" ] || { echo "::error::Secret ECOMMLAB_NEW_HOST fehlt"; missing=1; }
          [ -n "$USER" ] || { echo "::error::Secret ECOMMLAB_NEW_USER fehlt"; missing=1; }
          [ -n "$KEY" ] || { echo "::error::Secret ECOMMLAB_NEW_SSH_KEY fehlt"; missing=1; }
          exit "$missing"

      - name: Deploy to ecommlab-new via SSH
        env:
          SSH_HOST: ${{ secrets.ECOMMLAB_NEW_HOST }}
          SSH_USER: ${{ secrets.ECOMMLAB_NEW_USER }}
          SSH_KEY: ${{ secrets.ECOMMLAB_NEW_SSH_KEY }}
          REMOTE_PATH: ${{ secrets.ECOMMLAB_NEW_PATH }}
        run: |
          set -euo pipefail
          REMOTE_PATH="${REMOTE_PATH:-/var/www/ecommlab-relaunch}"
          install -m 600 /dev/null "$HOME/.ssh/ecommlab_new"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/ecommlab_new"
          SSH=(ssh -i "$HOME/.ssh/ecommlab_new" -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes)
          RSYNC_SSH="ssh -i $HOME/.ssh/ecommlab_new -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes"

          "${SSH[@]}" "${SSH_USER}@${SSH_HOST}" "mkdir -p '${REMOTE_PATH}'"

          rsync -az --delete \
            -e "$RSYNC_SSH" \
            --exclude '.git/' \
            --exclude 'node_modules/' \
            --exclude '.next/' \
            --exclude '.pids/' \
            --exclude '.env.production' \
            --exclude '.env.local' \
            --exclude '.env*.local' \
            --exclude 'docs/' \
            ./ "${SSH_USER}@${SSH_HOST}:${REMOTE_PATH}/"

          "${SSH[@]}" "${SSH_USER}@${SSH_HOST}" bash -s <<REMOTE
          set -euo pipefail
          cd '${REMOTE_PATH}'
          npm ci
          npm run build
          if command -v pm2 >/dev/null 2>&1; then
            pm2 restart ecommlab-prod || ./scripts/server-start.sh prod
            pm2 status ecommlab-prod || true
          else
            ./scripts/server-stop.sh prod || true
            ./scripts/server-start.sh prod
          fi
          REMOTE

          echo "### Deployed to ecommlab-new" >> "$GITHUB_STEP_SUMMARY"
          echo "- Host: \`${SSH_HOST}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Path: \`${REMOTE_PATH}\`" >> "$GITHUB_STEP_SUMMARY"

  deploy-gcloud:
    if: inputs.target == 'gcloud'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve environment
        id: env
        run: |
          ENV=prod
          set -a; source "deploy/environments/${ENV}.env"; set +a
          if [ "${PROJECT_NUMBER}" = "CHANGEME_RUN_PROVISION" ] || [ -z "${PROJECT_NUMBER}" ]; then
            echo "::error::${ENV}.env has no PROJECT_NUMBER — run scripts/gcp-provision.sh ${ENV} --write-config"
            exit 1
          fi
          {
            echo "env_name=${ENV}"
            echo "project_id=${PROJECT_ID}"
            echo "region=${REGION}"
            echo "repo=${REPO}"
            echo "web_service=${WEB_SERVICE}"
            echo "site_url=${NEXT_PUBLIC_SITE_URL}"
            echo "cookiebot_id=${NEXT_PUBLIC_COOKIEBOT_ID}"
            echo "gtm_id=${NEXT_PUBLIC_GTM_ID}"
            echo "turnstile_site_key=${NEXT_PUBLIC_TURNSTILE_SITE_KEY}"
            echo "wif_provider=projects/${PROJECT_NUMBER}/locations/global/workloadIdentityPools/${WIF_POOL}/providers/${WIF_PROVIDER}"
            echo "deployer_sa=${DEPLOYER_SA}@${PROJECT_ID}.iam.gserviceaccount.com"
          } >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ steps.env.outputs.wif_provider }}
          service_account: ${{ steps.env.outputs.deployer_sa }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ steps.env.outputs.project_id }}

      - name: Build & deploy via Cloud Build
        run: |
          gcloud builds submit \
            --config cloudbuild.yaml \
            --substitutions=COMMIT_SHA=${GITHUB_SHA::12},_REGION=${{ steps.env.outputs.region }},_REPO=${{ steps.env.outputs.repo }},_SERVICE=${{ steps.env.outputs.web_service }},_NEXT_PUBLIC_SITE_URL=${{ steps.env.outputs.site_url }},_NEXT_PUBLIC_COOKIEBOT_ID=${{ steps.env.outputs.cookiebot_id }},_NEXT_PUBLIC_GTM_ID=${{ steps.env.outputs.gtm_id }},_NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ steps.env.outputs.turnstile_site_key }} \
            .

      - name: Print service URL
        run: |
          URL=$(gcloud run services describe "${{ steps.env.outputs.web_service }}" \
            --region "${{ steps.env.outputs.region }}" --format 'value(status.url)')
          echo "Deployed: ${URL}"
          echo "### Deployed to Google Cloud" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: \`${{ steps.env.outputs.env_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Service: \`${{ steps.env.outputs.web_service }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: ${URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Hinweis: DNS zeigt noch auf ecommlab-new, bis ihr bewusst umstellt." >> "$GITHUB_STEP_SUMMARY"
